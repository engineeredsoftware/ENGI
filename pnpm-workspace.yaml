packages:
  # Applications (Next.js, MCP, external agent surfaces)
  - 'apps/*'
  - 'apps/uapi'
  - 'apps/uapi/**'
  # Exclude test fixture repos from workspace to avoid CI frozen-lockfile errors
  - '!apps/uapi/tests/fixtures/**'

  # Shared domain / host / tooling packages (consumable by any app or image)
  - 'packages/*'
  - 'packages/*/*'
  - 'packages/*/*/*'

  # OCI / appliance images (Pipeliner, …)
  - 'images/*'
