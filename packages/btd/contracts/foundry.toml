[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
# Quote hashing locals overflow stack without IR pipeline.
via_ir = true

# Remappings for forge-std
remappings = ["forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
sepolia = "${BITCODE_ETHEREUM_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
